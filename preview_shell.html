<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thesis 1.3 · Website preview</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#edf2f8;color:#0d2544}.preview-bar{padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #cad6e4;background:white}.preview-bar strong{font-size:17px}.preview-bar span{font-size:12px;color:#496079}.preview-bar button{border:1px solid #b6c9df;background:#f4f7fc;padding:8px 12px;border-radius:5px;color:#0d2544;cursor:pointer}.preview-bar a{color:#153c78}#notice{padding:10px 18px;background:#fff3d6;font-size:14px;margin:0}iframe{border:0;width:100%;height:calc(100vh - 90px);display:block;background:white}body.mobile iframe{width:390px;max-width:100%;margin:auto;box-shadow:0 0 22px #293c5d33}@media(max-width:600px){.preview-bar{gap:8px}.preview-bar span{flex-basis:100%}}
</style></head><body><div class="preview-bar"><strong>Thesis 1.3</strong><span>Saved-data preview · Filters and reports work · Forms need the deployed app</span><button id="home">Home</button><button id="opportunities">Top Opportunities</button><button id="mobile">Mobile view</button></div><p id="notice" role="status" hidden></p><iframe id="site" title="Thesis website preview" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
<script type="application/json" id="preview-data">PAYLOAD_JSON</script><script>
const DATA=JSON.parse(document.getElementById('preview-data').textContent),frame=document.getElementById('site'),notice=document.getElementById('notice');let current='/';
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(message){notice.textContent=message;notice.hidden=false}
function normalized(path){const u=new URL(path,'https://preview.invalid');if(u.pathname==='/top-opportunities')return u.pathname+'?view='+(u.searchParams.get('view')||'all');if(u.pathname==='/discover')return u.search?' /discover?sort=combined'.trim():'/discover';if(u.pathname==='/search'){let q=u.searchParams.get('q')||'';q=DATA.names[q.toLowerCase()]||q.toUpperCase();return '/search?'+new URLSearchParams({q,snapshot:DATA.snapshot})}if(u.pathname.startsWith('/sources/'))return u.pathname+'?'+new URLSearchParams({snapshot:DATA.snapshot});return u.pathname}
function navigate(path){const key=normalized(path);if(!DATA.pages[key]){say('This company is outside the saved preview. Live searches are available after you deploy Thesis.');return}current=path;notice.hidden=true;frame.srcdoc=DATA.pages[key];history.replaceState(null,'','#'+encodeURIComponent(path))}
function makeLink(doc,label,path){const a=doc.createElement('a');a.className='secondary-report-btn';a.textContent=label;a.href=path;return a}
function filterPage(doc,url){const isFinder=url.pathname==='/discover';if(isFinder&&!url.search)return;const view=isFinder?'all':url.searchParams.get('view')||'all';const sector=url.searchParams.get('sector')||'',size=url.searchParams.get('size')||'',sort=url.searchParams.get('sort')||'combined',minimum=Number(url.searchParams.get('minimum_quality')||0),page=Math.max(1,Number(url.searchParams.get('page')||1));
let rows=(view==='excluded'?DATA.excluded:DATA.rankings).filter(r=>(!sector||r.sector===sector)&&(!size||(r.market_cap!=null&&(size==='small'?r.market_cap<2e9:size==='mid'?r.market_cap>=2e9&&r.market_cap<1e10:r.market_cap>=1e10)))&&(!minimum||(r.quality!=null&&r.quality>=minimum))&&(view!=='screen'||r.screen_match)&&(view!=='watchlist'||r.category==='watchlist')&&(view!=='partial'||r.partial));
if(view!=='excluded')rows.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):(a[sort]==null)-(b[sort]==null)||(b[sort]||0)-(a[sort]||0)||(sort==='combined'?(b.quality||0)-(a.quality||0):0)||a.symbol.localeCompare(b.symbol));
for(const [key,value] of Object.entries({sector,size,sort,minimum_quality:minimum})){const input=doc.querySelector('[name="'+key+'"]');if(input)input.value=value}
const title=doc.querySelector('.results-heading h2');if(title)title.textContent=rows.length+(isFinder?' research candidates':' companies');const headingPage=doc.querySelector('.results-heading > span');if(headingPage)headingPage.textContent='Page '+page;
const selected=rows.slice((page-1)*10,page*10);if(view==='excluded'){const area=doc.querySelector('section.container > div.section-stack');if(area)area.innerHTML=selected.map(r=>DATA.excludedRows[r.symbol]||'').join('')||'<div class="panel">No unrated companies match these filters.</div>'}else{const body=doc.querySelector('table.research-table tbody');if(body)body.innerHTML=selected.map(r=>DATA.rows[r.symbol]).join('')||'<tr><td colspan="6">No companies match these preferences. Broaden a filter to explore more of the research universe.</td></tr>'}
const pager=doc.querySelector('.pagination');if(pager){pager.replaceChildren();const pagePath=n=>{const copy=new URL(url);copy.searchParams.set('page',n);copy.searchParams.set('snapshot',DATA.snapshot);return copy.pathname+copy.search};if(page>1)pager.append(makeLink(doc,'Previous companies',pagePath(page-1)));if(page*10<rows.length)pager.append(makeLink(doc,'Show more companies',pagePath(page+1)));const label=doc.createElement('span');label.textContent='Page '+page;pager.append(label)}
}
frame.addEventListener('load',()=>{const doc=frame.contentDocument,url=new URL(current,'https://preview.invalid');if(['/top-opportunities','/discover'].includes(url.pathname))filterPage(doc,url);
doc.addEventListener('click',event=>{const a=event.target.closest('a[href]');if(!a)return;const href=a.getAttribute('href');if(href.startsWith('#')){event.preventDefault();const anchor=doc.getElementById(href.slice(1));if(anchor)anchor.scrollIntoView({behavior:'smooth'});return;}if(/^(https?:|mailto:)/i.test(href))return;event.preventDefault();navigate(href)});
doc.addEventListener('submit',event=>{event.preventDefault();const form=event.target;if(form.method.toLowerCase()==='post'){say('Preview only: nothing was submitted or saved. Set up Railway and PostgreSQL to use this form.');return}const parameters=new URLSearchParams(new FormData(form));const path=form.getAttribute('action')||url.pathname;navigate(path+'?'+parameters.toString())});
const input=doc.getElementById('company-search');if(input){input.addEventListener('input',()=>{const panel=doc.getElementById('suggestions'),q=input.value.toLowerCase().trim();if(!panel)return;panel.replaceChildren();if(q.length<2){panel.hidden=true;return}const choices=DATA.rankings.filter(r=>r.name.toLowerCase().includes(q)||r.symbol.toLowerCase().startsWith(q)).slice(0,8);for(const row of choices){const button=doc.createElement('button');button.type='button';button.className='suggestion-item';button.textContent=row.name+' ('+row.symbol+')';button.onclick=()=>navigate('/search?q='+row.symbol);panel.append(button)}panel.hidden=!choices.length})}
});
document.getElementById('home').onclick=()=>navigate('/');document.getElementById('opportunities').onclick=()=>navigate('/top-opportunities');document.getElementById('mobile').onclick=()=>{document.body.classList.toggle('mobile');document.getElementById('mobile').textContent=document.body.classList.contains('mobile')?'Desktop view':'Mobile view'};
let initial='/';try{if(location.hash)initial=decodeURIComponent(location.hash.slice(1))}catch(e){}navigate(initial);
</script></body></html>
